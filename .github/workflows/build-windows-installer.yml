name: build-windows-installer
run-name: build-windows-installer (${{ github.event_name }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Build version (for example 1.0.0)
        required: false
        default: ""
      release_tag:
        description: Existing release tag to upload into (for example Version-1.0.0-2026.3.27)
        required: false
        default: ""
      upload_to_release:
        description: Upload the built installer into the resolved release
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-windows-installer.yml"
      - "Windows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build metadata
        id: meta
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"
          $version = "${{ github.event.inputs.version }}"
          $releaseTag = "${{ github.event.inputs.release_tag }}"
          $shouldUpload = "true"

          if ($eventName -eq "workflow_dispatch") {
            if ("${{ github.event.inputs.upload_to_release }}" -ne "true") {
              $shouldUpload = "false"
            }
          } elseif ($refType -eq "tag") {
            $releaseTag = $refName
          } else {
            git fetch --tags --force
            $releaseTag = git tag --list "Version-*" --sort=-creatordate | Select-Object -First 1
          }

          $version = $version.Trim()
          $releaseTag = $releaseTag.Trim()

          if (-not $releaseTag -and $refType -eq "tag") {
            $releaseTag = $refName.Trim()
          }

          if (-not $version) {
            if ($releaseTag -match "(\d+\.\d+\.\d+)") {
              $version = $Matches[1]
            } elseif ($refName -match "(\d+\.\d+\.\d+)") {
              $version = $Matches[1]
            }
          }

          if (-not $version) {
            throw "Missing version. Pass workflow_dispatch input `version`, or use a tag/release name containing x.y.z."
          }

          if ($shouldUpload -eq "true" -and -not $releaseTag) {
            throw "Missing release tag. Pass workflow_dispatch input `release_tag`, or ensure the repository already has a `Version-*` tag."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "should_upload=$shouldUpload" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Windows/requirements.txt
          python -m pip install -r Windows/packaging/requirements-build.txt

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build Windows installer
        shell: pwsh
        run: python Windows/scripts/build_installer.py --platform windows --version ${{ steps.meta.outputs.version }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchAssistant-windows-${{ steps.meta.outputs.version }}
          path: Windows/dist/installers/windows/*

      - name: Upload release asset
        if: steps.meta.outputs.should_upload == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          files: Windows/dist/installers/windows/ResearchAssistant-windows-${{ steps.meta.outputs.version }}.exe
          overwrite_files: true
          fail_on_unmatched_files: true
