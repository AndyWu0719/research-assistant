name: build-windows-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Build version (for example 1.0.0)
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}"
          }
          $version = $version.Trim()
          $version = $version.TrimStart("v")
          if (-not $version) {
            throw "Missing version input."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r packaging/requirements-build.txt

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build Windows installer
        shell: pwsh
        run: python scripts/build_installer.py --platform windows --version ${{ steps.meta.outputs.version }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchAssistant-windows-${{ steps.meta.outputs.version }}
          path: dist/installers/windows/*

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installers/windows/ResearchAssistant-windows-${{ steps.meta.outputs.version }}.exe
