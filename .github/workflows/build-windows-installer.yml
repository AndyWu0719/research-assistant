name: build-windows-installer
run-name: build-windows-installer (${{ github.event_name }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Build version (for example 1.1.0)
        required: false
        default: ""
      release_tag:
        description: Existing release tag to upload into (for example v1.1.0)
        required: false
        default: ""
      upload_to_release:
        description: Upload the built installer into the resolved release
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-windows-installer.yml"
      - "Windows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          payload="$(python scripts/release_metadata.py \
            --event-name "${{ github.event_name }}" \
            --ref-type "${{ github.ref_type }}" \
            --ref-name "${{ github.ref_name }}" \
            --version "${{ github.event.inputs.version }}" \
            --release-tag "${{ github.event.inputs.release_tag }}" \
            --upload-to-release "${{ github.event.inputs.upload_to_release }}" )"
          version="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["version"])' "$payload")"
          release_tag="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["release_tag"])' "$payload")"
          should_upload="$(python -c 'import json,sys; print(str(json.loads(sys.argv[1])["should_upload"]).lower())' "$payload")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_upload=$should_upload" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Windows/requirements.txt
          python -m pip install -r Windows/packaging/requirements-build.txt

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build Windows installer
        shell: pwsh
        run: python Windows/scripts/build_installer.py --platform windows --version ${{ steps.meta.outputs.version }}

      - name: Materialize signing certificate
        if: steps.meta.outputs.should_upload == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERT_BASE64) { throw "Missing WINDOWS_SIGNING_CERT_BASE64" }
          if (-not $env:WINDOWS_SIGNING_CERT_PASSWORD) { throw "Missing WINDOWS_SIGNING_CERT_PASSWORD" }
          $certPath = Join-Path $env:RUNNER_TEMP "windows-signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          "WINDOWS_SIGNING_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign Windows installer
        if: steps.meta.outputs.should_upload == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $installer = "Windows/dist/installers/windows/ResearchAssistant-windows-${{ steps.meta.outputs.version }}.exe"
          $timestamp = if ($env:WINDOWS_SIGNING_TIMESTAMP_URL) { $env:WINDOWS_SIGNING_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & "$env:GITHUB_WORKSPACE\Windows\packaging\windows\sign_installer.ps1" `
            -InstallerPath $installer `
            -CertificatePath $env:WINDOWS_SIGNING_CERT_PATH `
            -CertificatePassword $env:WINDOWS_SIGNING_CERT_PASSWORD `
            -TimestampUrl $timestamp

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchAssistant-windows-${{ steps.meta.outputs.version }}
          path: Windows/dist/installers/windows/*

      - name: Upload release asset
        if: steps.meta.outputs.should_upload == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          files: Windows/dist/installers/windows/ResearchAssistant-windows-${{ steps.meta.outputs.version }}.exe
          overwrite_files: true
          fail_on_unmatched_files: true
